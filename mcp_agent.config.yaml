execution_engine: "asyncio"
logger:
  transports: [console, file]
  level: info

openai:
  default_model: "gemini-3.6-flash"

mcp:
  servers:
    linux_system:
      command: ".venv/bin/python"
      args: ["-m", "servers.linux_server"]
    fetch:
      command: "uvx"
      args: ["mcp-server-fetch"]
    filesystem:
      command: "npx"
      args: ["-y", "@modelcontextprotocol/server-filesystem", "."]

